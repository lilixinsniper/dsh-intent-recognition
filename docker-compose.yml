# Quick-start PostgreSQL with pgvector for dsh-intent-recognition.
#   docker compose up -d
# Then point the plugin config `databaseUrl` at
#   postgres://postgres:postgres@127.0.0.1:5432/dsh_intent
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dsh-intent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dsh_intent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
